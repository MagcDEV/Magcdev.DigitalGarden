<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Drill</title>
<style>
  :root {
    --ink: #14213D;
    --ink-soft: #3E4A63;
    --paper: #FFFFFF;
    --paper-tint: #F4F6F9;
    --rule: #D9DEE7;
    --strong: #0F6E56;
    --strong-bg: #E1F5EE;
    --strong-ink: #085041;
    --eventual: #534AB7;
    --eventual-bg: #EEEDFE;
    --eventual-ink: #3C3489;
    --money: #BA7517;
    --money-bg: #FAEEDA;
    --money-ink: #633806;
    --warn: #A32D2D;
    --warn-bg: #FCEBEB;
    --warn-ink: #791F1F;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  /* Dark mode. The palette follows the garden's saved "theme" preference
     (shared with the Quartz toggle) and, when none is saved, the system setting. */
  :root[data-theme="dark"] {
    --ink: #E4E9F2;
    --ink-soft: #A6B0C3;
    --paper: #0E131C;
    --paper-tint: #171E2B;
    --rule: #2B3548;
    --strong: #5CCBA8;
    --strong-bg: #10302A;
    --strong-ink: #B9E8D6;
    --eventual: #A9A0F5;
    --eventual-bg: #24214A;
    --eventual-ink: #D6D2FB;
    --money: #E3A84D;
    --money-bg: #342611;
    --money-ink: #F2D8A8;
    --warn: #EF8585;
    --warn-bg: #3B1A1A;
    --warn-ink: #F5C4C4;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #E4E9F2;
      --ink-soft: #A6B0C3;
      --paper: #0E131C;
      --paper-tint: #171E2B;
      --rule: #2B3548;
      --strong: #5CCBA8;
      --strong-bg: #10302A;
      --strong-ink: #B9E8D6;
      --eventual: #A9A0F5;
      --eventual-bg: #24214A;
      --eventual-ink: #D6D2FB;
      --money: #E3A84D;
      --money-bg: #342611;
      --money-ink: #F2D8A8;
      --warn: #EF8585;
      --warn-bg: #3B1A1A;
      --warn-ink: #F5C4C4;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--serif); font-size: 17px; line-height: 1.55; color: var(--ink); background: var(--paper); }
  a { color: var(--strong); }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--eventual); outline-offset: 2px; }
  code { font-family: var(--mono); font-size: 0.88em; background: var(--paper-tint); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .app { max-width: 780px; margin: 0 auto; padding: 28px 20px 64px; }
  header.top { margin: 0 56px 22px 0; }
  header.top h1 { font-size: 32px; line-height: 1.12; font-weight: 500; letter-spacing: -0.01em; margin: 0 0 6px; }
  header.top p { margin: 0; color: var(--ink-soft); font-size: 16px; }

  .theme-toggle { position: fixed; top: 14px; right: 14px; z-index: 10; width: 40px; height: 40px; padding: 0; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper-tint); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .theme-toggle:hover { border-color: var(--strong); color: var(--strong); }
  .theme-toggle svg { width: 20px; height: 20px; display: block; }
  .theme-toggle .icon-moon, :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }
  :root:not([data-theme]) .theme-toggle { display: none; }

  .panel { border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px; background: var(--paper); margin-bottom: 18px; }
  .label { font-family: var(--sans); font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .setup-block { margin-bottom: 20px; }
  .setup-block:last-child { margin-bottom: 0; }

  .chip { font-family: var(--sans); font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink-soft); cursor: pointer; }
  .chip:hover { border-color: var(--eventual); }
  .chip[aria-pressed="true"] { background: var(--eventual-bg); border-color: var(--eventual); color: var(--eventual-ink); font-weight: 600; }
  .chip .n { font-variant-numeric: tabular-nums; opacity: 0.7; margin-right: 4px; }
  .link-btn { font-family: var(--sans); font-size: 13.5px; background: none; border: 0; padding: 4px 2px; color: var(--strong); text-decoration: underline; cursor: pointer; }
  .check { font-family: var(--sans); font-size: 14.5px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .check input { width: 17px; height: 17px; accent-color: var(--eventual); }

  .primary { font-family: var(--sans); font-size: 16px; font-weight: 600; padding: 11px 22px; border-radius: 8px; border: 0; background: var(--strong); color: var(--paper); cursor: pointer; }
  .primary:hover { filter: brightness(1.08); }
  .primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .secondary { font-family: var(--sans); font-size: 15px; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper-tint); color: var(--ink); cursor: pointer; }
  .secondary:hover { border-color: var(--strong); }
  .muted { color: var(--ink-soft); font-size: 15px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px; }

  .progress { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--sans); font-size: 14px; color: var(--ink-soft); margin: 0 2px 8px; }
  .bar { height: 5px; border-radius: 999px; background: var(--paper-tint); border: 1px solid var(--rule); overflow: hidden; margin-bottom: 16px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--eventual); transition: width 0.25s ease; }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

  .badge { display: inline-block; font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; }
  .badge.easy { background: var(--strong-bg); color: var(--strong-ink); }
  .badge.medium { background: var(--money-bg); color: var(--money-ink); }
  .badge.hard { background: var(--warn-bg); color: var(--warn-ink); }
  .q-title { font-size: 22px; font-weight: 500; line-height: 1.25; margin: 10px 0 8px; }
  .q-title.hidden-title { color: var(--ink-soft); font-style: italic; font-size: 17px; }
  .q-text { font-size: 19px; line-height: 1.5; margin: 0; }
  .ask { font-family: var(--sans); font-size: 15px; font-weight: 600; margin: 20px 0 0; }

  .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
  @media (max-width: 620px) { .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .choice { font-family: var(--sans); font-size: 14.5px; text-align: left; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; line-height: 1.25; }
  .choice:hover:not(:disabled) { border-color: var(--eventual); background: var(--eventual-bg); }
  .choice:disabled { cursor: default; opacity: 0.55; }
  .choice.is-right { opacity: 1; border-color: var(--strong); background: var(--strong-bg); color: var(--strong-ink); font-weight: 700; }
  .choice.is-also { opacity: 1; border-color: var(--money); background: var(--money-bg); color: var(--money-ink); }
  .choice.is-wrong { opacity: 1; border-color: var(--warn); background: var(--warn-bg); color: var(--warn-ink); text-decoration: line-through; }

  .verdict { font-family: var(--sans); font-size: 17px; font-weight: 700; margin: 0 0 10px; }
  .verdict.right { color: var(--strong); }
  .verdict.also { color: var(--money); }
  .verdict.wrong { color: var(--warn); }
  .answer { border-left: 4px solid var(--rule); }
  .answer.right { border-left-color: var(--strong); }
  .answer.also { border-left-color: var(--money); }
  .answer.wrong { border-left-color: var(--warn); }
  .answer dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; }
  .answer dt { font-family: var(--sans); font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); padding-top: 4px; }
  .answer dd { margin: 0; }
  .signal { margin: 4px 0 0; padding: 8px 12px; border-radius: 6px; background: var(--eventual-bg); color: var(--eventual-ink); font-size: 15.5px; }
  .links { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 14px 0 0; font-family: var(--sans); font-size: 14.5px; }
  .next-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; background: var(--paper-tint); }

  .score { font-size: 44px; font-weight: 500; line-height: 1; margin: 4px 0 6px; }
  .miss-list { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--rule); }
  .miss-list li { padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .miss-list .fam { font-family: var(--sans); font-size: 13.5px; color: var(--ink-soft); }
  .miss-list .links { margin-top: 4px; }
</style>
<script>
  // Theme: reads the garden's saved "theme" preference (the Quartz toggle
  // writes the same key), falls back to the system setting, and keeps the
  // embedded page in step with the host page.
  (function () {
    var root = document.documentElement;
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    function saved() { try { return localStorage.getItem("theme"); } catch (e) { return null; } }
    function current() { var s = saved(); return s === "dark" || s === "light" ? s : (media.matches ? "dark" : "light"); }
    function apply(theme) {
      root.setAttribute("data-theme", theme);
      var button = document.querySelector(".theme-toggle");
      if (button) {
        button.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
        button.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
      }
    }
    apply(current());
    document.addEventListener("DOMContentLoaded", function () {
      apply(current());
      var button = document.querySelector(".theme-toggle");
      if (!button) return;
      button.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        try { localStorage.setItem("theme", next); } catch (e) {}
        apply(next);
        try { if (window.parent !== window) window.parent.document.documentElement.setAttribute("saved-theme", next); } catch (e) {}
      });
    });
    window.addEventListener("storage", function (e) { if (e.key === "theme" || e.key === null) apply(current()); });
    media.addEventListener("change", function () { if (!saved()) apply(current()); });
  })();
</script>
</head>
<body>
<button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<div class="app">
  <header class="top">
    <h1>Name the pattern</h1>
    <p>Read the problem. Choose the pattern family that solves it. Write no code.</p>
  </header>

  <!-- 1. Setup -->
  <section id="setup">
    <div class="panel">
      <div class="setup-block">
        <p class="label">Stages</p>
        <div class="row" id="stage-chips"></div>
        <div class="row" style="margin-top:8px">
          <button class="link-btn" type="button" data-pick="all">All</button>
          <button class="link-btn" type="button" data-pick="base">Stages 1 to 7</button>
          <button class="link-btn" type="button" data-pick="none">None</button>
        </div>
      </div>
      <div class="setup-block">
        <p class="label">Level</p>
        <div class="row" id="level-chips"></div>
      </div>
      <div class="setup-block">
        <p class="label">Questions</p>
        <div class="row" id="count-chips"></div>
      </div>
      <div class="setup-block">
        <label class="check"><input type="checkbox" id="hide-titles" checked> Hide the problem title until I answer</label>
      </div>
    </div>
    <div class="actions">
      <button class="primary" type="button" id="start">Start</button>
      <button class="secondary" type="button" id="start-missed" hidden></button>
      <span class="muted" id="pool-size"></span>
    </div>
  </section>

  <!-- 2. Question -->
  <section id="quiz" hidden>
    <div class="progress"><span id="q-count"></span><span id="q-score"></span></div>
    <div class="bar"><i id="q-bar"></i></div>
    <div class="panel">
      <span class="badge" id="q-level"></span>
      <h2 class="q-title" id="q-title"></h2>
      <p class="q-text" id="q-text"></p>
      <p class="ask" id="q-ask">Which pattern family solves it?</p>
      <div class="choices" id="choices"></div>
    </div>
    <div class="panel answer" id="answer" hidden aria-live="polite">
      <p class="verdict" id="verdict"></p>
      <dl id="answer-body"></dl>
      <div class="links" id="answer-links"></div>
      <div class="next-row">
        <button class="primary" type="button" id="next">Next</button>
        <span class="muted">or press <kbd>Enter</kbd></span>
      </div>
    </div>
    <div class="actions"><button class="link-btn" type="button" id="quit">Stop this session</button></div>
  </section>

  <!-- 3. Result -->
  <section id="result" hidden>
    <div class="panel">
      <p class="label">Result</p>
      <p class="score" id="r-score"></p>
      <p class="muted" id="r-line"></p>
      <ul class="miss-list" id="r-misses"></ul>
    </div>
    <div class="actions">
      <button class="primary" type="button" id="retry" hidden>Repeat the misses</button>
      <button class="secondary" type="button" id="again">New session</button>
    </div>
  </section>
</div>

,"url":"https://leetcode.com/problems/counting-bits/","free":""},{"lc":190,"title":"Reverse Bits","level":"Easy","stage":"c18","also":[],"summary":"Reverse the order of the 32 bits of an integer.","pattern":"Shift in and shift out","templates":[{"letter":"D","name":"Shift in and shift out","signal":"The problem asks you to reverse the bits of a number, or to build a number from the bits of a second number.","href":"../../wiki/neetcode-150/18-bit-manipulation#template-d-shift-in-and-shift-out"}],"solution":"../../wiki/neetcode-150/18-bit-manipulation#190-reverse-bits","url":"https://leetcode.com/problems/reverse-bits/","free":""},{"lc":268,"title":"Missing Number","level":"Easy","stage":"c18","also":["c17","c01"],"summary":"An array holds n different numbers from the range 0 to n. Find the number that is missing, with O(1) extra space.","pattern":"XOR of indexes and values","templates":[{"letter":"A","name":"XOR cancels pairs","signal":"Each value appears two times, and one value appears only one time. Or one number of a full range is missing. The problem asks for O(1) extra space, so a hash map is not permitted.","href":"../../wiki/neetcode-150/18-bit-manipulation#template-a-xor-cancels-pairs"}],"solution":"../../wiki/neetcode-150/18-bit-manipulation#268-missing-number","url":"https://leetcode.com/problems/missing-number/","free":""},{"lc":371,"title":"Sum of Two Integers","level":"Medium","stage":"c18","also":[],"summary":"Add two integers without the operators + and -.","pattern":"Add with XOR and carry","templates":[{"letter":"E","name":"Add with XOR and carry","signal":"The problem asks for a sum, and the operators <code>+<\/code> and <code>-<\/code> are not permitted.","href":"../../wiki/neetcode-150/18-bit-manipulation#template-e-add-with-xor-and-carry"}],"solution":"../../wiki/neetcode-150/18-bit-manipulation#371-sum-of-two-integers","url":"https://leetcode.com/problems/sum-of-two-integers/","free":""},{"lc":7,"title":"Reverse Integer","level":"Medium","stage":"c18","also":["c17"],"summary":"Reverse the digits of a signed 32-bit integer. Return 0 if the result is outside the 32-bit range.","pattern":"Digit loop with an overflow check","templates":[{"letter":"F","name":"Digit loop with an overflow check","signal":"The problem builds a number digit by digit, and the result must stay in the 32-bit range. The problem says that 64-bit storage is not permitted.","href":"../../wiki/neetcode-150/18-bit-manipulation#template-f-digit-loop-with-an-overflow-check"}],"solution":"../../wiki/neetcode-150/18-bit-manipulation#7-reverse-integer","url":"https://leetcode.com/problems/reverse-integer/","free":""}]};

(function () {
  "use strict";
  const STAGES = DATA.stages, PROBLEMS = DATA.problems;
  const stageById = {};
  STAGES.forEach(function (s) { stageById[s.id] = s; });
  const byLc = {};
  PROBLEMS.forEach(function (p) { byLc[p.lc] = p; });
  const LEVELS = ["Easy", "Medium", "Hard"];
  const COUNTS = [10, 20, 0];            // 0 = all the problems that match
  const STORE = "nc150-pattern-drill";

  const $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function link(href, text, top) {
    const a = el("a", "", text);
    a.href = href;
    a.target = top ? "_top" : "_blank";
    if (!top) a.rel = "noopener";
    return a;
  }

  // The saved state is only a convenience: the list of problems missed last time.
  function load() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
  function save(obj) { try { localStorage.setItem(STORE, JSON.stringify(obj)); } catch (e) {} }

  const state = {
    stages: new Set(STAGES.map(function (s) { return s.id; })),
    levels: new Set(LEVELS),
    count: 10,
    queue: [], index: 0, right: 0, also: 0, misses: [], answered: false,
  };

  // ---------- setup ----------
  function chip(label, pressed, onClick, small) {
    const b = el("button", "chip");
    b.type = "button";
    if (small) { const n = el("span", "n", small); b.appendChild(n); }
    b.appendChild(document.createTextNode(label));
    b.setAttribute("aria-pressed", pressed ? "true" : "false");
    b.addEventListener("click", onClick);
    return b;
  }
  function pool() {
    return PROBLEMS.filter(function (p) { return state.stages.has(p.stage) && state.levels.has(p.level); });
  }
  function renderSetup() {
    const sc = $("stage-chips"); sc.textContent = "";
    STAGES.forEach(function (s) {
      sc.appendChild(chip(s.name, state.stages.has(s.id), function () {
        if (state.stages.has(s.id)) state.stages.delete(s.id); else state.stages.add(s.id);
        renderSetup();
      }, String(s.n)));
    });
    const lc = $("level-chips"); lc.textContent = "";
    LEVELS.forEach(function (lv) {
      lc.appendChild(chip(lv, state.levels.has(lv), function () {
        if (state.levels.has(lv)) state.levels.delete(lv); else state.levels.add(lv);
        renderSetup();
      }));
    });
    const cc = $("count-chips"); cc.textContent = "";
    COUNTS.forEach(function (c) {
      cc.appendChild(chip(c === 0 ? "All that match" : String(c), state.count === c, function () {
        state.count = c; renderSetup();
      }));
    });
    const n = pool().length;
    $("pool-size").textContent = n + (n === 1 ? " problem matches" : " problems match");
    $("start").disabled = n === 0;
    const missed = (load().missed || []).filter(function (lc) { return byLc[lc]; });
    const mb = $("start-missed");
    mb.hidden = missed.length === 0;
    mb.textContent = "Repeat my " + missed.length + (missed.length === 1 ? " miss" : " misses") + " from last time";
  }
  document.querySelectorAll("[data-pick]").forEach(function (b) {
    b.addEventListener("click", function () {
      const pick = b.getAttribute("data-pick");
      state.stages = new Set(STAGES.filter(function (s) {
        return pick === "all" || (pick === "base" && s.n <= 7);
      }).map(function (s) { return s.id; }));
      renderSetup();
    });
  });

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function show(id) {
    ["setup", "quiz", "result"].forEach(function (s) { $(s).hidden = s !== id; });
    window.scrollTo(0, 0);
  }
  function begin(list) {
    state.queue = shuffle(list.slice());
    state.index = 0; state.right = 0; state.also = 0; state.misses = [];
    show("quiz");
    renderQuestion();
  }
  $("start").addEventListener("click", function () {
    const all = shuffle(pool());
    begin(state.count === 0 ? all : all.slice(0, state.count));
  });
  $("start-missed").addEventListener("click", function () {
    begin((load().missed || []).map(function (lc) { return byLc[lc]; }).filter(Boolean));
  });

  // ---------- question ----------
  function fullTitle(p) { return p.lc + ". " + p.title; }
  function renderQuestion() {
    const p = state.queue[state.index];
    state.answered = false;
    $("q-count").textContent = "Problem " + (state.index + 1) + " of " + state.queue.length;
    $("q-score").textContent = state.right + state.also + " correct";
    $("q-bar").style.width = (100 * state.index / state.queue.length) + "%";
    const lv = $("q-level"); lv.textContent = p.level; lv.className = "badge " + p.level.toLowerCase();
    const t = $("q-title");
    if ($("hide-titles").checked) { t.textContent = "The title shows after your answer."; t.className = "q-title hidden-title"; }
    else { t.textContent = fullTitle(p); t.className = "q-title"; }
    $("q-text").textContent = p.summary;
    const box = $("choices"); box.textContent = "";
    STAGES.forEach(function (s) {
      const b = el("button", "choice", s.name);
      b.type = "button";
      b.dataset.stage = s.id;
      b.addEventListener("click", function () { answer(s.id); });
      box.appendChild(b);
    });
    $("answer").hidden = true;
    $("q-ask").hidden = false;
  }

  function answer(stageId) {
    if (state.answered) return;
    state.answered = true;
    const p = state.queue[state.index];
    const kind = stageId === p.stage ? "right" : (p.also.indexOf(stageId) >= 0 ? "also" : "wrong");
    if (kind === "right") state.right++;
    else if (kind === "also") state.also++;
    else state.misses.push({ p: p, chose: stageId });

    document.querySelectorAll("#choices .choice").forEach(function (b) {
      b.disabled = true;
      const id = b.dataset.stage;
      if (id === p.stage) b.classList.add("is-right");
      else if (p.also.indexOf(id) >= 0) b.classList.add("is-also");
      else if (id === stageId) b.classList.add("is-wrong");
    });

    const t = $("q-title"); t.textContent = fullTitle(p); t.className = "q-title";
    const home = stageById[p.stage].name;
    const v = $("verdict");
    v.className = "verdict " + kind;
    v.textContent = kind === "right" ? "Correct: " + home + "."
      : kind === "also" ? "Also a valid family. This path puts it in " + home + "."
      : "Not this one. The family is " + home + ".";
    $("answer").className = "panel answer " + kind;

    const body = $("answer-body"); body.textContent = "";
    function rowOf(label, node) { body.appendChild(el("dt", "", label)); const dd = el("dd"); dd.appendChild(node); body.appendChild(dd); }
    rowOf("Pattern", document.createTextNode(p.pattern));
    p.templates.forEach(function (tp) {
      const wrap = el("div");
      wrap.appendChild(link(tp.href, "Template " + tp.letter + ": " + tp.name, true));
      const sig = el("p", "signal");
      sig.innerHTML = "<b>Signal.</b> " + tp.signal;   // generated from the stage pages, already escaped
      wrap.appendChild(sig);
      rowOf("Template", wrap);
    });
    if (p.also.length) {
      rowOf("Also valid", document.createTextNode(p.also.map(function (id) { return stageById[id].name; }).join(", ")));
    }
    const links = $("answer-links"); links.textContent = "";
    links.appendChild(link(p.solution, "Open the solution in three steps", true));
    links.appendChild(link(p.url, "Open on LeetCode", false));
    if (p.free) links.appendChild(link(p.free, "Free version on NeetCode", false));

    $("q-score").textContent = state.right + state.also + " correct";
    $("q-bar").style.width = (100 * (state.index + 1) / state.queue.length) + "%";
    $("q-ask").hidden = true;
    $("answer").hidden = false;
    $("next").textContent = state.index + 1 === state.queue.length ? "See the result" : "Next";
    $("next").focus({ preventScroll: true });
    $("answer").scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function next() {
    if (!state.answered) return;
    state.index++;
    if (state.index >= state.queue.length) finish(); else { renderQuestion(); window.scrollTo(0, 0); }
  }
  $("next").addEventListener("click", next);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !$("quiz").hidden && state.answered && document.activeElement !== $("next")) { e.preventDefault(); next(); }
  });
  $("quit").addEventListener("click", function () {
    if (state.index === 0 && !state.answered) { show("setup"); renderSetup(); return; }
    state.queue = state.queue.slice(0, state.index + (state.answered ? 1 : 0));
    finish();
  });

  // ---------- result ----------
  function finish() {
    const total = state.queue.length, ok = state.right + state.also;
    save({ missed: state.misses.map(function (m) { return m.p.lc; }) });
    $("r-score").textContent = ok + " of " + total;
    const pct = total ? Math.round(100 * ok / total) : 0;
    $("r-line").textContent = total === 0 ? "No problem was answered."
      : pct >= 90 ? "Very good. These signals are automatic. Add the next stage."
      : pct >= 70 ? "Good. For each miss, read the signal of the correct template one more time."
      : "This is the step to train. Read the signals of these stages again, then repeat the misses.";
    const ul = $("r-misses"); ul.textContent = "";
    state.misses.forEach(function (m) {
      const li = el("li");
      li.appendChild(el("div", "", fullTitle(m.p)));
      li.appendChild(el("div", "fam", "You chose " + stageById[m.chose].name + ". The family is " + stageById[m.p.stage].name + ": " + m.p.pattern + "."));
      const links = el("div", "links");
      m.p.templates.forEach(function (tp) { links.appendChild(link(tp.href, "Template " + tp.letter + ": " + tp.name, true)); });
      links.appendChild(link(m.p.solution, "Solution", true));
      li.appendChild(links);
      ul.appendChild(li);
    });
    $("retry").hidden = state.misses.length === 0;
    show("result");
  }
  $("retry").addEventListener("click", function () { begin(state.misses.map(function (m) { return m.p; })); });
  $("again").addEventListener("click", function () { show("setup"); renderSetup(); });

  renderSetup();
})();
</script>
</body>
